[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
npm-scope = "@cainus"
publish-jobs = ["npm"]
install-path = "CARGO_HOME"
install-updater = false
